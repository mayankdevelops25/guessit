# Cloudflare Pages Functions config — Option A (Cloudflare Pages + Functions + KV)
name = "guess-of-the-day"
compatibility_date = "2026-07-28"
pages_build_output_dir = "dist"

# KV for SESSION binds (anonymous sessions + streak + state)
# Created with: npx wrangler kv namespace create SESSION_KV
[[kv_namespaces]]
binding = "SESSION_KV"
id = "7573eb0a097440888a8124a2f0a726cc"
preview_id = "f8742eae01834010b64f82d940ffd456"

# ANALYTICS_KV optional for event buffering
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"

[vars]
ENVIRONMENT = "production"
# SHARE_SECRET is set as a Cloudflare secret (not here) — run:
# npx wrangler secret put SHARE_SECRET

# Rate limiting (dashboard): Security -> Rate limiting rules
# Rule 1: /api/chip  — 80 req/min per IP+Session
# Rule 2: /api/guess — 30 req/min per IP+Session
# DDoS is automatic via orange-cloud proxy
